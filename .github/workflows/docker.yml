name: Docker

on:
  workflow_call:

jobs:

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: setup Docker build
      uses: docker/setup-buildx-action@v2.0.0

    - name: Download a build artifact
      uses: docker/download-artifact@v3.0.0
      with:
        name: program 

    - name: Docker login
      uses: docker/login-action@v2.0.0
      with:
        username: ${{secrets.DOCKER_HUB_USER}} #docker-hub-username
        password: ${{secrets.DOCKER_HUB_PASSWORD}} #docker-hub-password

    - name: Build and push Docker images
      uses: docker/build-push-action@v3.0.0
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ugomes/go_ci:${{github.ref_name}}
